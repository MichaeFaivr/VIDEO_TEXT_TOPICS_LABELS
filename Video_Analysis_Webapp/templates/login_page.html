<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Login Page</title> -->
     <!-- the system must check if the username is in the users database -->
     <!-- if not, display an error message -->
     <!-- if the username is in the database, check if the password is correct -->
    <header>
        <style>
            header h1 {
                color: rgb(4, 4, 68);
                font-size: 3em; /* Makes the font 2 sizes larger */
            }
            header p {
                font-size: 1.5em; /* Slightly larger font for the tagline */
                color: rgb(10, 10, 100);
            }
        </style>
        <h1>Welcome to Shaire</h1>
        <p><em>Please enter your Login and Password</em></p>
    </header>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="/verbatim_video_upload/" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
        <form action="/register/" method="get">
            <div class="form-group">
                <p style="text-align: center; margin-top: 20px;">
                    <a href="/register" style="color: #007bff; text-decoration: none;">Create a new account</a>
                </p>
            </div>
        </form>
    </div>
</body>
</html>
