    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Registration</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .registration-card {
                background: rgba(255, 255, 255, 0.95);
                padding: 2rem;
                border-radius: 15px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
                width: 90%;
                max-width: 450px;
            }
            
            .card-header {
                text-align: center;
                margin-bottom: 2rem;
            }
            
            .card-title {
                color: #2c3e50;
                font-size: 1.8rem;
                font-weight: 600;
            }
            
            .input-group {
                margin-bottom: 1.5rem;
            }
            
            .input-label {
                display: block;
                color: #34495e;
                font-weight: 500;
                margin-bottom: 0.5rem;
            }
            
            .text-input {
                width: 100%;
                padding: 0.75rem;
                border: 2px solid #e0e6ed;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s ease;
            }
            
            .text-input:focus {
                outline: none;
                border-color: #667eea;
            }
            
            .interests-section {
                margin-top: 1rem;
            }
            
            .checkbox-wrapper {
                display: flex;
                align-items: center;
                margin: 0.6rem 0;
                cursor: pointer;
            }
            
            .checkbox-input {
                margin-right: 0.5rem;
                transform: scale(1.2);
            }
            
            .checkbox-label {
                color: #2c3e50;
                user-select: none;
            }
            
            .register-button {
                width: 100%;
                padding: 0.9rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease;
                margin-top: 1rem;
            }
            
            .register-button:hover {
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
        <div class="registration-card">
            <div class="card-header">
                <h2 class="card-title">Join Our Platform</h2>
            </div>
            
            <form method="POST" action="/register">
                <div class="input-group">
                    <label class="input-label" for="username">Full Name</label>
                    <input class="text-input" type="text" id="username" name="username" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="userpass">Password</label>
                    <input class="text-input" type="password" id="userpass" name="userpass" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Select Your Interests</label>
                    <div class="interests-section">
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="tech" name="interests" value="technology">
                            <label class="checkbox-label" for="tech">Technology</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="sports" name="interests" value="sports">
                            <label class="checkbox-label" for="sports">Sports</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="music" name="interests" value="music">
                            <label class="checkbox-label" for="music">Music</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="travel" name="interests" value="travel">
                            <label class="checkbox-label" for="travel">Travel</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="cooking" name="interests" value="cooking">
                            <label class="checkbox-label" for="cooking">Cooking</label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="register-button">Create Account</button>
            </form>
        </div>
    </body>
    </html></div>
