<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .success-card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
        }
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #10b981;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .company-name {
            color: #667eea;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 20px;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="checkmark">✓</div>
        <h1>Registration Successful!</h1>
        <div class="company-name">{{ company_name }}</div>
        <p>Your company account has been successfully created. You can now access all features and start managing your business operations.</p>
        <a href="/company_signedin_page?company_name={{ company_name }}" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
