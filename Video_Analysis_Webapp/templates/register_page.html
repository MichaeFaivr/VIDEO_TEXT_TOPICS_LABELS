<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Registration</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .registration-card {
                background: rgba(255, 255, 255, 0.95);
                padding: 2rem;
                border-radius: 15px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
                width: 90%;
                max-width: 450px;
            }
            
            .card-header {
                text-align: center;
                margin-bottom: 2rem;
            }
            
            .card-title {
                color: #2c3e50;
                font-size: 1.8rem;
                font-weight: 600;
            }
            
            .input-group {
                margin-bottom: 1.5rem;
            }
            
            .input-label {
                display: block;
                color: #34495e;
                font-weight: 500;
                margin-bottom: 0.5rem;
            }
            
            .text-input {
                width: 100%;
                padding: 0.75rem;
                border: 2px solid #e0e6ed;
                border-radius: 8px;
                font-size: 1rem;
                transition: border-color 0.3s ease;
            }
            
            .text-input:focus {
                outline: none;
                border-color: #667eea;
            }
            
            .interests-section {
                margin-top: 1rem;
            }
            
            .checkbox-wrapper {
                display: flex;
                align-items: center;
                margin: 0.6rem 0;
                cursor: pointer;
            }
            
            .checkbox-input {
                margin-right: 0.5rem;
                transform: scale(1.2);
            }
            
            .checkbox-label {
                color: #2c3e50;
                user-select: none;
            }
            
            .register-button {
                width: 100%;
                padding: 0.9rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease;
                margin-top: 1rem;
            }
            
            .register-button:hover {
                transform: translateY(-2px);
            }
            
            .tooltip {
                position: relative;
                display: inline-block;
            }
            
            .tooltip-content {
                visibility: hidden;
                width: 250px;
                background-color: #333;
                color: #fff;
                text-align: left;
                border-radius: 6px;
                padding: 10px;
                position: absolute;
                z-index: 1;
                border-width: 5px;
                border-style: solid;
                border-color: #333 transparent transparent transparent;
            }
            
            .tooltip:hover .tooltip-content {
                visibility: visible;
                opacity: 1;
            }

            .form-columns {
                display: flex;
                gap: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .form-column {
                flex: 1;
            }

            .radio-wrapper {
                display: flex;
                align-items: center;
                margin: 0.6rem 0;
                cursor: pointer;
            }

            .radio-input {
                margin-right: 0.5rem;
                transform: scale(1.2);
            }

            .radio-label {
                color: #2c3e50;
                user-select: none;
            }

            @media (max-width: 600px) {
                .form-columns {
                    flex-direction: column;
                    gap: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="registration-card">
            <div class="card-header">
                <h2 class="card-title">Join Our Platform</h2>
            </div>
            {% if error_existing_user %}
                <div style="color: red; font-size: 14px; margin-bottom: 10px;">
                    {{ error_existing_user }}
                </div>
            {% endif %}
            
            <form method="POST" action="/register">
                <div class="input-group">
                    <label class="input-label" for="username">Full Name</label>
                    <input class="text-input" type="text" id="username" name="username" required>
                </div>
                <!-- ATTENTION: the system needs to check if the username already exists -->
    
                <div class="input-group">
                    <label class="input-label" for="password">Password</label>
                    <div class="tooltip">
                        <span style="cursor: help; color: #667eea; margin-left: 5px;">ℹ️</span>
                        <div class="tooltip-content">
                            Password must contain:
                            <ul>
                                <li>10+ characters</li>
                                <li>1+ capital letter</li>
                                <li>1+ symbol</li>
                                <li>1+ digit</li>
                            </ul>
                        </div>
                    </div>
                    <input class="text-input" type="password" id="password" name="password" required>
                    <div id="password-error" style="color: red; font-size: 12px; margin-top: 5px; display: none;">
                        Please comply to the rules for password.
                    </div><br>
                </div>

                <div class="input-group">
                    <label class="input-label" for="email">Email (optional)</label>
                    <input class="text-input" type="email" id="email" name="email">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Select Your Interests</label>
                    <div class="interests-section">
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="tech" name="interests" value="technology">
                            <label class="checkbox-label" for="tech">Technology</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="sports" name="interests" value="sports">
                            <label class="checkbox-label" for="sports">Sports</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="music" name="interests" value="music">
                            <label class="checkbox-label" for="music">Music</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="travel" name="interests" value="travel">
                            <label class="checkbox-label" for="travel">Travel</label>
                        </div>
                        <div class="checkbox-wrapper">
                            <input class="checkbox-input" type="checkbox" id="cooking" name="interests" value="cooking">
                            <label class="checkbox-label" for="cooking">Cooking</label>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Select Your Age Group</label>
                    <div class="age-group-section">
                        <div class="radio-wrapper">
                            <input class="radio-input" type="radio" id="age-18-25" name="age_group" value="18-25">
                            <label class="radio-label" for="age-18-25">18 - 25</label>
                        </div>
                        <div class="radio-wrapper">
                            <input class="radio-input" type="radio" id="age-26-35" name="age_group" value="26-35">
                            <label class="radio-label" for="age-26-35">26 - 35</label>
                        </div>
                        <div class="radio-wrapper">
                            <input class="radio-input" type="radio" id="age-36-45" name="age_group" value="36-45">
                            <label class="radio-label" for="age-36-45">36 - 45</label>
                        </div>
                        <div class="radio-wrapper">
                            <input class="radio-input" type="radio" id="age-46-55" name="age_group" value="46-55">
                            <label class="radio-label" for="age-46-55">46 - 55</label>
                        </div>
                        <div class="radio-wrapper">
                            <input class="radio-input" type="radio" id="age-55-plus" name="age_group" value="55+">
                            <label class="radio-label" for="age-55-plus">55+</label>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="register-button">Create Account</button>
                <!-- TODO: Here the system needs to register the new user in the users database -->
                <!-- create in the folder: databases/user_accounts the account as a Json file with the following informations: 
                 username, email, password, list of topics of interest -->
                                
                <script>
                        document.getElementById('password').addEventListener('blur', function() {
                        const password = this.value;
                        const errorDiv = document.getElementById('password-error');
                        
                        // Check password requirements
                        const hasMinLength = password.length >= 10;
                        const hasCapital = /[A-Z]/.test(password);
                        const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
                        const hasDigit = /\d/.test(password);
                        
                        if (!hasMinLength || !hasCapital || !hasSymbol || !hasDigit) {
                            this.value = '';
                            errorDiv.style.display = 'block';
                        } else {
                            errorDiv.style.display = 'none';
                        }
                    });
                    
                    document.querySelector('form').addEventListener('submit', function(e) {
                        const password = document.getElementById('password').value;
                        const errorDiv = document.getElementById('password-error');
                        
                        const hasMinLength = password.length >= 10;
                        const hasCapital = /[A-Z]/.test(password);
                        const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
                        const hasDigit = /\d/.test(password);
                        
                        if (!hasMinLength || !hasCapital || !hasSymbol || !hasDigit) {
                            e.preventDefault();
                            document.getElementById('password').value = '';
                            errorDiv.style.display = 'block';
                        }
                    });
                </script>
            </form>
        </div>
    </body>
    </html></div>
<!DOCTYPE html>
